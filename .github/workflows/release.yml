name: Publicar versión

# Se ejecuta al subir una etiqueta tipo v0.0.5.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Descargar Dalamud
        run: |
          mkdir -p "$HOME/.xlcore/dalamud/Hooks/dev"
          curl -sSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q dalamud.zip -d "$HOME/.xlcore/dalamud/Hooks/dev"
          echo "DALAMUD_HOME=$HOME/.xlcore/dalamud/Hooks/dev" >> "$GITHUB_ENV"

      - name: Compilar y empaquetar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet build -c Release -p:Version="$VERSION"
          ZIP="$(find . -name latest.zip -path '*Release*' | head -n 1)"
          echo "Paquete: $ZIP"
          test -n "$ZIP"
          cp "$ZIP" ./latest.zip

      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" latest.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Versión ${GITHUB_REF_NAME#v}"

      - name: Actualizar repo.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOW="$(date +%s)"
          jq --arg v "$VERSION" --argjson t "$NOW" \
            '.[0].AssemblyVersion = $v | .[0].LastUpdate = $t' repo.json > repo.tmp
          mv repo.tmp repo.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add repo.json
          git commit -m "Actualizar repo.json a $VERSION" || exit 0
          git push origin HEAD:main
